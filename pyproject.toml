[project]
name = "4dllm"
version = "0.2.0"
description = "Local 4D-STEM workbench with browser, CLI, and MCP interfaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pillow>=11",
    "requests>=2.32",
    "httpx[socks]>=0.28.1",
    "matplotlib>=3.10.6",
    "mcp>=1.13.1",
    "numpy>=2.3.2",
    "pglast>=7.7",
    "psycopg[binary]>=3.2.10",
    "psycopg-pool>=3.2.6",
    "scipy>=1.16.1",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
simulation = ["abtem>=1.0", "ase>=3.24", "dask>=2025.1"]
